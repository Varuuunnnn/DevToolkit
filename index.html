<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional developer utilities toolkit with gzip compression, JWT decoding, password generation, JSON formatting, and more. All processing happens locally in your browser." />
    <meta name="keywords" content="developer tools, gzip, jwt, json formatter, password generator" />
    <meta name="author" content="DevToolkit" />
    <title>DevToolkit - Professional Developer Utilities</title>
    
    <!-- Open Graph meta tags for social sharing -->
    <meta property="og:title" content="DevToolkit - Professional Developer Utilities" />
    <meta property="og:description" content="Comprehensive toolkit for developers with utilities for compression, encryption, formatting, and testing. All processing is local." />
    <meta property="og:type" content="website" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#3B82F6" />
    
    <!-- Strict Content Security Policy: blocks all external connections -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" />
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <style>
      html { visibility: hidden; }
      html.loaded { visibility: visible; }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <script>
      // Prevent FOUC
      document.addEventListener('DOMContentLoaded', function() {
        document.documentElement.classList.add('loaded');
      });
    </script>
  </body>
</html>
